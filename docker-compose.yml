services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shipz-dev

    working_dir: /workspace

    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
      - npm-cache:/root/.npm

    ports:
      - "8080:8080"
      - "4200:4200"

    environment:
      DB_URL: jdbc:postgresql://db:5432/shipz
      DB_USERNAME: shipz
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    stdin_open: true
    tty: true

  db:
    image: postgres:18.6-alpine

    container_name: shipz-postgres

    environment:
      POSTGRES_DB: shipz
      POSTGRES_USER: shipz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipz -d shipz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  maven-cache:
  npm-cache:
